name: Weirdhost 自动续期

on:
  schedule:
    # 每天北京时间 00:15 (UTC 16:15)
    - cron: '15 16 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Chrome (macOS 真 GPU)
        run: |
          # 禁用 brew 自动升级索引，节省 2-5 分钟 runner 运行时间
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install --cask google-chrome 2>/dev/null || true
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version || true

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动家宽代理 (VLESS/Trojan/SS -> 本地 Socks)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          VLESS_NODE: ${{ secrets.VLESS_NODE }}
          TROJAN_NODE: ${{ secrets.TROJAN_NODE }}
          WEIRDHOST_PROXY: ${{ secrets.WEIRDHOST_PROXY }}
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
        run: |
          python scripts/vless_helper.py
          
          # 根据是否生成了配置文件决定是否安装并启动 sing-box
          if [ -f "/tmp/singbox.json" ]; then
            echo "[proxy] 检测到节点配置，开始准备 sing-box..."
            SINGBOX_VER="1.11.3"
            UNAME=$(uname -m)
            if [ "$UNAME" = "arm64" ]; then ARCH="arm64"; else ARCH="amd64"; fi
            
            curl -fsSL -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-darwin-${ARCH}.tar.gz"
            tar -xzf /tmp/sing-box.tar.gz -C /tmp
            sudo mv /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
            sudo chmod +x /usr/local/bin/sing-box
            
            echo "[proxy] 启动 sing-box 后台进程..."
            nohup sing-box run -c /tmp/singbox.json > /tmp/singbox.log 2>&1 &
            sleep 3
            
            # 代理通道探活测试（尝试 3 次）
            PROXY_OK=no
            for i in 1 2 3; do
              if curl -x socks5h://127.0.0.1:10808 -sI https://www.cloudflare.com/cdn-cgi/trace --connect-timeout 6 -m 10 >/dev/null 2>&1; then
                PROXY_OK=yes
                break
              fi
              echo "[proxy] 第 $i 次握手尝试未通，等待重试..."
              sleep 2
            done

            if [ "$PROXY_OK" = "yes" ]; then
              echo "[proxy] 代理通道握手测试成功！当前代理 IP 详情："
              curl -x socks5h://127.0.0.1:10808 -s https://www.cloudflare.com/cdn-cgi/trace --connect-timeout 5 -m 10 | head -n 10
            else
              echo "::warning::[proxy] 代理握手失败，以下为 sing-box 实时错误日志："
              cat /tmp/singbox.log || true
              echo "[proxy] 后续将以无代理或直连模式尝试（macOS 真 GPU 也可过盾）"
            fi
          else
            echo "[proxy] 未配置 VLESS/代理节点，跳过安装（真 GPU 直连模式）"
          fi

      - name: 运行续期脚本
        env:
          WEIRDHOST_COOKIE_1: ${{ secrets.WEIRDHOST_COOKIE_1 }}
          WEIRDHOST_COOKIE_2: ${{ secrets.WEIRDHOST_COOKIE_2 }}
          WEIRDHOST_COOKIE_3: ${{ secrets.WEIRDHOST_COOKIE_3 }}
          WEIRDHOST_COOKIE_4: ${{ secrets.WEIRDHOST_COOKIE_4 }}
          WEIRDHOST_COOKIE_5: ${{ secrets.WEIRDHOST_COOKIE_5 }}
          WEIRDHOST_ACCOUNTS: ${{ secrets.WEIRDHOST_ACCOUNTS }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RENEW_THRESHOLD_DAYS: "2"
          WEIRDHOST_PROXY: ${{ secrets.WEIRDHOST_PROXY }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          VLESS_NODE: ${{ secrets.VLESS_NODE }}
          TROJAN_NODE: ${{ secrets.TROJAN_NODE }}
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        run: |
          python scripts/weirdhost_renew.py

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 3
          if-no-files-found: ignore

      - name: 清理旧工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
